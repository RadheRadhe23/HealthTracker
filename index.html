<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Health & Hygiene Tracker</title>
<style>
:root{--bg:#f4f7f4;--card:#fff;--tx:#1d2a24;--mut:#66736c;--ac:#2f8f6b;--ac2:#dff1e9;--bd:#e2e6e1;--warn:#d98a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--tx:#e8efea;--mut:#93a39a;--ac:#4cc39a;--ac2:#21362d;--bd:#2a3731;--warn:#e8a547}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--tx:#e8efea;--mut:#93a39a;--ac:#4cc39a;--ac2:#21362d;--bd:#2a3731;--warn:#e8a547}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:620px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}
h2{font-size:1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav b{font-size:1.05rem}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.hero{display:flex;align-items:center;gap:16px}
.hero p{margin:2px 0;color:var(--mut);font-size:.92rem}
.ring text{fill:var(--tx);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:6px}
.chk i{width:22px;height:22px;border-radius:7px;border:2px solid var(--bd);display:grid;place-items:center;font-style:normal;font-size:14px;flex:none}
.chk.on{background:var(--ac2);color:var(--tx);border-color:var(--ac)}
.chk.on i{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;flex-wrap:wrap}
.seg{display:flex;gap:6px}
.drops{display:flex;gap:4px;flex-wrap:wrap}
.drops span{width:20px;height:26px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--bd)}
.drops span.f{background:#4aa3df}
input[type=number]{width:80px;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.mut{color:var(--mut);font-size:.9rem}
.tip{background:var(--ac2);border-radius:12px;padding:10px 12px;font-size:.93rem}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;text-align:center;font-size:.75rem;color:var(--mut)}
.bars span{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px}
.small{font-size:.78rem;color:var(--mut);text-align:center;margin:8px 0 24px}
</style></head><body><main id="app"></main>
<script>
var H=[['bam','Brushed teeth (morning)'],['bpm','Brushed teeth (night)'],['floss','Flossed'],['shower','Showered / bathed'],['hands','Washed hands before meals'],['skin','Face wash / skincare'],['clothes','Wore clean clothes'],['nails','Nails & grooming (weekly)']];
var M=[['b','Breakfast'],['l','Lunch'],['d','Dinner']];
var MOODS=['😞','😕','😐','🙂','😄'];
var LAB=['Hygiene','Nutrition','Hydration','Sleep','Movement'];
var TIPS=['Tick off your hygiene habits – small routines add up.','Aim for balanced meals and up to 5 servings of fruit or veg.','Drink a glass of water now – the goal is 8 a day.','Try to get 7–9 hours of sleep tonight.','A 30-minute walk or workout counts. Even 10 minutes helps.'];
var D={};try{D=JSON.parse(localStorage.getItem('hht')||'{}')}catch(e){}
function save(){try{localStorage.setItem('hht',JSON.stringify(D))}catch(e){}}
function blank(){return{h:[],w:0,s:'',m:{},v:0,e:'',mood:0,n:''}}
function key(o){var t=new Date();t.setDate(t.getDate()+o);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function peek(k){return D[k]||blank()}
function get(k){return D[k]||(D[k]=blank())}
function parts(d){
 var f=0;M.forEach(function(x){f+=({g:1,o:.5,p:0})[d.m[x[0]]]||0});
 var s=parseFloat(d.s)||0,sl=s?(s>=7&&s<=9?1:Math.max(0,1-(s<7?7-s:s-9)/3)):0;
 return[d.h.length/H.length,(f/3)*.6+Math.min(d.v/5,1)*.4,Math.min(d.w/8,1),sl,Math.min((parseFloat(d.e)||0)/30,1)]}
function score(d){var p=parts(d);return Math.round(p.reduce(function(a,b){return a+b},0)/5*100)}
var off=0;
function render(){
 var k=key(off),d=peek(k),p=parts(d),sc=score(d),c=2*Math.PI*38;
 var dt=new Date();dt.setDate(dt.getDate()+off);
 var title=off===0?'Today':off===-1?'Yesterday':dt.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
 var st=0;for(var i=0;i<365;i++){var q=D[key(-i)];if(q&&score(q)>=60)st++;else if(i>0||q)break}
 var low=p.indexOf(Math.min.apply(null,p));
 var h='<h1>🌿 Health & Hygiene Tracker</h1><div class="nav"><button data-a="day" data-v="-1">‹</button><b>'+title+'</b><button data-a="day" data-v="1"'+(off>=0?' disabled style="opacity:.4"':'')+'>›</button></div>';
 h+='<div class="card hero"><svg class="ring" width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="38" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="48" cy="48" r="38" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(c*sc/100)+' '+c+'" transform="rotate(-90 48 48)"/><text x="48" y="54" text-anchor="middle" font-size="22">'+sc+'</text></svg><div><b>Daily wellness score</b><p>🔥 '+st+'-day streak (score 60+)</p><p>'+LAB.map(function(l,i){return l+' '+Math.round(p[i]*100)+'%'}).join(' · ')+'</p></div></div>';
 h+='<div class="tip">💡 Focus on: '+TIPS[low]+'</div><br>';
 h+='<div class="card"><h2>🪥 Hygiene</h2>'+H.map(function(x){var on=d.h.indexOf(x[0])>-1;return'<button class="chk'+(on?' on':'')+'" data-a="h" data-v="'+x[0]+'"><i>'+(on?'✓':'')+'</i>'+x[1]+'</button>'}).join('')+'</div>';
 h+='<div class="card"><h2>🥗 Eating</h2>'+M.map(function(x){return'<div class="row"><span>'+x[1]+'</span><div class="seg">'+[['g','Good'],['o','OK'],['p','Poor']].map(function(o){return'<button class="'+(d.m[x[0]]===o[0]?'on':'')+'" data-a="meal" data-k="'+x[0]+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div></div>'}).join('')+'<div class="row"><span>Fruit & veg servings: <b>'+d.v+'</b> <span class="mut">/ 5</span></span><div class="seg"><button data-a="v" data-v="-1">−</button><button data-a="v" data-v="1">+</button></div></div></div>';
 h+='<div class="card"><h2>💧 Water</h2><div class="drops">'+[0,1,2,3,4,5,6,7].map(function(i){return'<span class="'+(i<d.w?'f':'')+'"></span>'}).join('')+'</div><div class="row"><span class="mut">'+d.w+' of 8 glasses</span><div class="seg"><button data-a="w" data-v="-1">−</button><button data-a="w" data-v="1">+ Glass</button></div></div></div>';
 h+='<div class="card"><h2>❤️ Body & mind</h2><div class="row"><label>😴 Sleep (hours)</label><input type="number" min="0" max="24" step="0.5" value="'+d.s+'" data-f="s"></div><div class="row"><label>🏃 Exercise (minutes)</label><input type="number" min="0" max="600" step="5" value="'+d.e+'" data-f="e"></div><div class="row"><span>Mood</span><div class="seg">'+MOODS.map(function(m,i){return'<button class="'+(d.mood===i+1?'on':'')+'" data-a="mood" data-v="'+(i+1)+'">'+m+'</button>'}).join('')+'</div></div><div class="mut" style="margin:10px 0 4px">Notes (symptoms, energy, medication, anything else)</div><textarea data-f="n">'+d.n.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</textarea></div>';
 var bars='';for(var j=6;j>=0;j--){var kk=key(-j),s2=D[kk]?score(D[kk]):0,dd=new Date();dd.setDate(dd.getDate()-j);bars+='<div><span style="height:'+s2*.8+'px"></span>'+'SMTWTFS'[dd.getDay()]+'</div>'}
 h+='<div class="card"><h2>📈 Last 7 days</h2><div class="bars">'+bars+'</div></div><p class="small">Data is saved privately in this browser only. This tracker is for self-awareness, not medical advice – see a doctor for health concerns.</p>';
 var a=document.getElementById('app'),y=window.scrollY;a.innerHTML=h;window.scrollTo(0,y)}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
 if(a==='day'){off=Math.min(0,off+ +v);render();return}
 var d=get(key(off));
 if(a==='h'){var i=d.h.indexOf(v);i>-1?d.h.splice(i,1):d.h.push(v)}
 else if(a==='meal')d.m[b.dataset.k]=d.m[b.dataset.k]===v?'':v;
 else if(a==='w')d.w=Math.max(0,Math.min(20,d.w+ +v));
 else if(a==='v')d.v=Math.max(0,Math.min(20,d.v+ +v));
 else if(a==='mood')d.mood=d.mood===+v?0:+v;
 save();render()});
document.addEventListener('change',function(e){var f=e.target.dataset.f;if(!f)return;get(key(off))[f]=e.target.value;save();render()});
render();
</script></body></html>
